<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Horas y Sueldo</title>
<meta name="description" content="Fichá entrada y salida y calculá tu sueldo con el convenio de Camioneros.">
<meta name="theme-color" content="#6bbd66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Horas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: una columna angosta como una tarjeta de fichaje. Arriba lo que llevás cobrado, abajo el detalle; pestañas fijas abajo.
   Paleta: verde y naranja de la farmacia, sin su logo. Verde = acciones y horas normales; naranja = salida y horas extra. */
:root{
  --bg:#eef2ee; --surface:#ffffff; --surface-2:#f3f6f3; --ink:#17201a; --muted:#57645a; --line:#d4ddd5;
  --green:#6bbd66; --green-strong:#347e30; --green-ink:#2f7a2c; --on-green:#ffffff;
  --orange:#f8923a; --on-orange:#1d1208; --mark-fg:#ffffff;
  --good:#2f7a2c; --warn:#a8540b; --bad:#c0362c;
  --scrim:rgba(8,12,9,.5); --toast-bg:#17201a; --toast-fg:#ffffff; --toast-act:#f8923a;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d120e; --surface:#151b16; --surface-2:#1c241d; --ink:#ecf2ec; --muted:#9caa9e; --line:#2a362c;
    --green:#6bbd66; --green-strong:#6bbd66; --green-ink:#8fd48a; --on-green:#0d120e;
    --orange:#f8923a; --on-orange:#1d1208; --mark-fg:#ffffff;
    --good:#8fd48a; --warn:#f4a259; --bad:#ff8a80;
    --scrim:rgba(0,0,0,.6); --toast-bg:#ecf2ec; --toast-fg:#0d120e; --toast-act:#2f7a2c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d120e; --surface:#151b16; --surface-2:#1c241d; --ink:#ecf2ec; --muted:#9caa9e; --line:#2a362c;
  --green:#6bbd66; --green-strong:#6bbd66; --green-ink:#8fd48a; --on-green:#0d120e;
  --orange:#f8923a; --on-orange:#1d1208; --mark-fg:#ffffff;
  --good:#8fd48a; --warn:#f4a259; --bad:#ff8a80;
  --scrim:rgba(0,0,0,.6); --toast-bg:#ecf2ec; --toast-fg:#0d120e; --toast-act:#2f7a2c;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green-strong);outline-offset:2px}
p{margin:0}
h2,h3{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:3px solid var(--green)}
.top-in{max-width:600px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:25px;letter-spacing:.01em;display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand-mark{width:26px;height:26px;flex:none}
.chip-store{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good)} .dot.busy{background:var(--orange)} .dot.local{background:var(--warn)} .dot.err{background:var(--bad)}

/* Contenido */
main{max-width:600px;margin:0 auto;padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{display:grid;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;display:grid;gap:12px}
.stripe{height:6px;margin:-16px -16px 2px;border-radius:11px 11px 0 0;background:linear-gradient(90deg,var(--green) 0 70%,var(--orange) 70% 100%)}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(46px,14vw,64px);line-height:.95;letter-spacing:-.005em;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:14.5px}
.sub b{color:var(--ink);font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px}
.stats b{font-weight:700}
.lead{font-size:16px}
.hint{font-size:13.5px;color:var(--muted)}
.sec-title{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.01em;line-height:1.1}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}
.row-btns.center{justify-content:center}
.row-btns.end{justify-content:flex-end}
.split{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-weight:600;font-size:15.5px;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--green-strong);color:var(--on-green);border-color:transparent}
.btn-orange{background:var(--orange);color:var(--on-orange);border-color:transparent}
.btn-ghost{background:none;border-color:transparent;color:var(--green-ink);padding:0 10px;min-height:42px}
.btn-danger{color:var(--bad)}
.btn-danger-fill{background:var(--bad);color:var(--surface);border-color:transparent}
.btn-xl{width:100%;min-height:72px;font-family:var(--f-display);font-size:32px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:12px;gap:14px}
.btn-xl .t{font-family:var(--f-mono);font-size:18px;font-weight:500;letter-spacing:0;opacity:.75}
.btn-block{width:100%}

/* Fichaje */
.clock{font-family:var(--f-mono);font-size:44px;font-weight:500;line-height:1;letter-spacing:-.02em}
.today-sum{display:grid;gap:4px;padding:12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.today-sum .mono{font-size:17px}

/* Semana */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end}
.wd{display:grid;gap:5px;justify-items:center;font-size:12.5px;color:var(--muted);min-width:0}
.wd b{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;font-size:13px}
.bar{width:100%;max-width:36px;height:88px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column-reverse}
.bar i{display:block;width:100%}
.bar .n{background:var(--green)}
.bar .x{background:var(--orange)}
.wd.hoy .lbl-d{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--orange);text-decoration-thickness:3px;text-underline-offset:3px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.sw.n{background:var(--green)} .sw.x{background:var(--orange)}

/* Días */
.weekhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;padding:4px 2px 0}
.weekhead h3{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.weekhead span{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.daylist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dayrow{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.dayrow:last-child{border-bottom:0}
.dnum{font-family:var(--f-display);text-align:center;line-height:1}
.dnum small{display:block;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dnum b{font-size:28px;font-weight:700}
.dmid{min-width:0;display:grid;gap:5px}
.tline{background:none;border:0;padding:0;text-align:left;font-family:var(--f-mono);font-size:15.5px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.tline.lbl{font-family:var(--f-body);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.x{background:var(--orange);border-color:transparent;color:var(--on-orange)}
.tag.warn{background:none;color:var(--warn);border-color:currentColor}
.tag.fer{background:none;color:var(--ink);border-color:var(--ink)}
.note{font-size:13px;color:var(--muted)}
.amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt b{display:block;font-weight:700;font-size:16px}
.amt small{color:var(--muted);font-size:13px}
.dayrow.ghost{background:repeating-linear-gradient(-45deg,transparent 0 10px,var(--surface-2) 10px 20px)}
.ghostbtn{background:none;border:0;padding:0;text-align:left;font-size:14.5px;color:var(--ink)}
.ghostbtn u{text-decoration-color:var(--orange);text-decoration-thickness:2px;text-underline-offset:3px}
.empty{text-align:center;padding:28px 16px;display:grid;gap:12px;justify-items:center}

/* Cobro / recibo */
.pnav{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px}
.pnav button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700}
.pnav button:disabled{opacity:.35;cursor:default}
.pnav div{text-align:center;min-width:0}
.pnav h2{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.05}
.rec{display:grid;gap:0}
.rec .rs{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 0 4px}
.rec .rs:first-child{padding-top:0}
.rec .ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.rec .ln .k{font-size:15px}
.rec .ln .k small{display:block;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);margin-top:2px}
.rec .ln .v{font-family:var(--f-mono);font-size:15px;text-align:right;white-space:nowrap}
.rec .ln.tot{border-bottom:1.5px solid var(--ink)}
.rec .ln.tot .k,.rec .ln.tot .v{font-weight:600}
.rec .ln.neg .v{color:var(--bad)}
.rec .neto{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding-top:14px}
.rec .neto span{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.rec .neto b{font-family:var(--f-display);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.diff{padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:15px}
.diff.ok{border-color:var(--good);color:var(--good)}
.diff.bad{border-color:var(--warn)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

/* Formularios */
.field{display:grid;gap:6px;min-width:0}
.field>label,.lbl{font-size:13.5px;font-weight:600;color:var(--muted)}
.input{width:100%;min-height:48px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:16px;min-width:0}
.input.mono{font-family:var(--f-mono)}
textarea.input{min-height:64px;resize:vertical}
.suf{display:flex;align-items:center;gap:8px}
.suf span{color:var(--muted);font-size:14.5px;white-space:nowrap}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:9px 13px;font-size:14.5px;font-weight:600;min-height:42px}
.seg button[aria-pressed="true"]{background:var(--green-strong);color:var(--on-green);border-color:transparent}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.check{display:flex;gap:10px;align-items:center;font-size:15.5px}
.check input{width:22px;height:22px;accent-color:var(--green-strong)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px dashed var(--line);background:none;border-radius:8px;padding:6px 10px;font-family:var(--f-mono);font-size:14px}
.preview{padding:12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:15px;display:grid;gap:3px}
.preview b{font-size:17px}
.err{color:var(--bad);font-size:14px;font-weight:600}
details.more{border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-weight:600;color:var(--green-ink);font-size:15px;min-height:36px;display:flex;align-items:center}
details.more[open]{display:grid;gap:12px}
.tarifa{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.tarifa:last-of-type{border-bottom:0}
.tarifa-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tarifa .vals{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:4px 10px;margin:0;font-size:14px;align-items:baseline}
.tarifa .vals dt{color:var(--muted)}
.tarifa .vals dd{margin:0;font-family:var(--f-mono);font-size:13.5px;white-space:nowrap}
@media (max-width:360px){.tarifa .vals{grid-template-columns:auto minmax(0,1fr)}}
.tarifa.vig{box-shadow:inset 4px 0 0 var(--green);padding-left:12px}
.banner{display:grid;gap:10px;padding:14px 16px;border-radius:12px;border:1.5px solid var(--warn);background:var(--surface)}
.copybox{width:100%;min-height:160px;font-family:var(--f-mono);font-size:12px}

/* Pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{background:none;border:0;border-top:3px solid transparent;padding:7px 4px 9px;display:grid;justify-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--green-ink);border-top-color:var(--green-strong)}

/* Capas */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim.center{align-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:16px 16px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dialog{background:var(--surface);border-radius:14px;padding:18px;width:100%;max-width:420px;display:grid;gap:12px;max-height:90vh;overflow:auto}
.dialog h2{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.1}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:16px;padding-bottom:18px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--toast-bg);color:var(--toast-fg);padding:11px 14px;border-radius:10px;z-index:60;display:flex;gap:14px;align-items:center;width:max-content;max-width:calc(100% - 32px);font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast button{background:none;border:0;color:var(--toast-act);font-weight:700;font-size:15px;padding:4px}
.sheet-open .toast{bottom:auto;top:calc(12px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="var(--green)"/><path d="M13 6.8V13l4 2.5" fill="none" stroke="var(--mark-fg)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="13" cy="13" r="2.2" fill="var(--orange)"/></svg>Horas y Sueldo</div>
  <button class="chip-store" id="chip-store" type="button" data-go="ajustes" aria-label="Dónde se guardan tus datos"><span class="dot ok" id="chip-dot"></span><span id="chip-txt">En este navegador</span></button>
</div></header>

<main>
  <section class="panel" id="tab-hoy"></section>
  <section class="panel" id="tab-dias" hidden></section>
  <section class="panel" id="tab-cobro" hidden></section>
  <section class="panel" id="tab-ajustes" hidden></section>
</main>

<nav class="tabs" aria-label="Secciones"><div class="tabs-in" role="tablist">
  <button class="tab" role="tab" type="button" data-go="hoy" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Hoy</button>
  <button class="tab" role="tab" type="button" data-go="dias" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Días</button>
  <button class="tab" role="tab" type="button" data-go="cobro" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Cobro</button>
  <button class="tab" role="tab" type="button" data-go="ajustes" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ajustes</button>
</div></nav>

<div id="layer"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="imp-file" accept=".json,application/json" hidden>

<script>
(() => {
'use strict';
document.documentElement.lang = 'es-AR';

/* ================= Datos de referencia ================= */
const CACHE_KEY = 'horas-sueldo:v1';
const UI_KEY = 'horas-sueldo:ui';

const DEFAULTS = {
  horaEntrada: '06:00', horaSalida: '14:00', horasJornada: 8,
  modo: 'salida',          // 'salida': las extras empiezan a la hora de salida del turno | 'total': después de 8 h trabajadas
  tolerancia: 0, bloqueTarde: 1, redondeo: 1, pausa: 0,
  recargoComun: 50, recargoEspecial: 100,

    document.body.appendChild(sc);
    const done = v => { sc.remove(); document.removeEventListener('keydown', onKey); res(v); };
    const onKey = e => { if (e.key === 'Escape') done(null); };
    document.addEventListener('keydown', onKey);
    sc.addEventListener('click', e => {
      const b = e.target.closest('[data-r]');
      if (b) { if (b.dataset.r === '1') { const inp = sc.querySelector('[data-val]'); done(inp ? inp.value : true); } else done(null); }
      else if (e.target === sc) done(null);
    });
    if (o.onMount) o.onMount(sc);

async function ofrecerArchivo(filename, data) {
  const cl = window.claude;
  if (!cl || typeof cl.use !== 'function') {
    try {
      const url = URL.createObjectURL(new Blob([data], { type: filename.endsWith('.csv') ? 'text/csv' : 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      return true;
    } catch (e) { mostrarParaCopiar(filename, data); return false; }
  }
  let dl = null;
  try { dl = await cl.use('downloads'); } catch (e) {}
  if (dl) {
    try { await dl.save({ filename, data }); return true; }
    catch (e) {
      const c = e && e.code;
      if (c === 'declined') return false;
      if (c === 'rate_limited') { toast('Ya hay una descarga esperando. Probá de nuevo en un momento.'); return false; }
    }
  }
  mostrarParaCopiar(filename, data);
  return false;
}
function mostrarParaCopiar(filename, data) {
  dialogo({
    titulo: 'Copiá tu copia', ok: 'Listo', cancel: false,
    html: '<p class="hint">Acá no se pudo descargar el archivo. Copiá el texto y guardalo en una nota o mandátelo por WhatsApp.</p><textarea class="input copybox" id="dlg-copy" readonly>' + esc(data) + '</textarea><button type="button" class="btn" id="dlg-copy-btn">Copiar</button>',
    onMount: sc => {
      sc.querySelector('#dlg-copy-btn').addEventListener('click', () => {
        const ta = sc.querySelector('#dlg-copy');
        const sel = () => { ta.focus(); ta.select(); };
        try { navigator.clipboard.writeText(data).then(() => toast('Copiado'), () => { sel(); toast('Seleccioná y copiá el texto'); }); }
        catch (e) { sel(); toast('Seleccioná y copiá el texto'); }
      });
    }
  });
}

function etiquetaTipo(t) { return { trabajo: 'Trabajé', enfermedad: 'Enfermedad con certificado', feriado: 'Feriado pago', falta: 'Falta' }[t] || t; }

  const keys = [...new Set([...fechas, ...ghosts])].sort().reverse();

    $('tab-dias').innerHTML = html; return;

  // Descanso entre jornadas: salida anterior → entrada siguiente
  const trab = todos.filter(x => x.tipo === 'trabajo' && x.entrada && x.salida).map(x => {

function leerEditor() {

    if (sa !== null) d.salida = sa;

    const te = v('ed-te'), ts = v('ed-ts'); if (te !== null) d.te = te || ''; if (ts !== null) d.ts = ts || '';
    const fe = $('ed-feriado'); if (fe) { const auto = !!FERIADOS[d.fecha]; d.feriado = fe.checked === auto ? null : fe.checked; }
  }
  const n = v('ed-nota'); if (n !== null) d.nota = n.slice(0, 300);

function guardarEditor(otro) {

  state.turnos[id] = rec;
  persist();
  if (otro) {
    ed = { id: null, d: { ...rec, fecha: addDays(rec.fecha, 1), nota: '', feriado: null }, err: '', conf: false };

}
function borrarTurno(id) {

async function editarTarifa(desde) {
  const tl = tarifas(), cur = desde ? tl.find(x => x.desde === desde) : null;
  const base = cur || tarifaPara(hoy(), tl);
  const nextMonth = (() => { const t = hoy(); const y = +t.slice(0, 4), m = +t.slice(5, 7); return (m === 12 ? (y + 1) + '-01' : y + '-' + pad(m + 1)) + '-01'; })();
  const html = '<div class="field"><label for="tf-desde">Desde</label><input class="input" type="date" id="tf-desde" value="' + (desde || nextMonth) + '"' + (desde ? ' disabled' : '') + '></div>' +
    (desde ? '' : '<div class="field"><label for="tf-pct">Aumento sobre los valores vigentes</label><div class="suf"><input class="input mono" id="tf-pct" inputmode="decimal" placeholder="1,7"><span>%</span></div><p class="hint">O escribí los valores exactos abajo.</p></div>') +
    '<div class="field"><label for="tf-jornal">Jornal</label><div class="suf"><span>$</span><input class="input mono" id="tf-jornal" inputmode="decimal" value="' + nf2.format(base.jornal) + '"></div></div>' +
    '<div class="grid2"><div class="field"><label for="tf-comida">Comida</label><div class="suf"><span>$</span><input class="input mono" id="tf-comida" inputmode="decimal" value="' + nf2.format(base.comida) + '"></div></div>' +
    '<div class="field"><label for="tf-especial">Viático especial</label><div class="suf"><span>$</span><input class="input mono" id="tf-especial" inputmode="decimal" value="' + nf2.format(base.especial) + '"></div></div></div>' +
    (cur && (cur.propia || cur.estimado) ? '<button type="button" class="btn btn-ghost btn-danger" id="tf-quitar" style="justify-self:start">' + (cur.propia && TARIFAS_BASE.some(b => b.desde === cur.desde) ? 'Volver al valor del acuerdo' : 'Quitar estos valores') + '</button>' : '');
  let quitar = false, vals = null;
  const ok = await dialogo({
    titulo: desde ? 'Valores desde el ' + fFull(desde) : 'Cargar un aumento', ok: 'Guardar', html,
    onMount: sc => {
      const pct = sc.querySelector('#tf-pct');
      if (pct) pct.addEventListener('input', () => {
        const p = parseNum(pct.value); if (!Number.isFinite(p)) return;
        const k = 1 + p / 100;
        sc.querySelector('#tf-jornal').value = nf2.format(r2(base.jornal * k));
        sc.querySelector('#tf-comida').value = nf2.format(r2(base.comida * k));
        sc.querySelector('#tf-especial').value = nf2.format(r2(base.especial * k));
      });
      const q = sc.querySelector('#tf-quitar');
      if (q) q.addEventListener('click', () => { quitar = true; sc.querySelector('[data-r="1"]').click(); });
      sc.querySelector('[data-r="1"]').addEventListener('click', () => {
        vals = { desde: sc.querySelector('#tf-desde').value, jornal: parseNum(sc.querySelector('#tf-jornal').value), comida: parseNum(sc.querySelector('#tf-comida').value), especial: parseNum(sc.querySelector('#tf-especial').value) };
      }, true);
    }
  });
  if (!ok || !vals) return;
  const k = desde || vals.desde;
  if (!isISO(k)) { toast('Elegí desde qué fecha rige.'); return; }
  if (quitar) {
    const esBase = TARIFAS_BASE.some(b => b.desde === k);
    state.tarifas[k] = cur && cur.propia ? { borrada: true, mod: Date.now() } : (esBase ? { oculta: true, mod: Date.now() } : { borrada: true, mod: Date.now() });
    persist(); toast('Listo'); return;
  }
  if (!(vals.jornal > 0) || !(vals.comida >= 0) || !(vals.especial >= 0)) { toast('Revisá los montos: tienen que ser números.'); return; }
  state.tarifas[k] = { jornal: r2(vals.jornal), comida: r2(vals.comida), especial: r2(vals.especial), nota: 'Cargado por vos', mod: Date.now() };
  persist(); toast('Valores guardados desde el ' + fFull(k));
}

async function exportarCSV() {
  const aj = AJ(), tl = tarifas();
  const n2 = v => (Math.round(v * 100) / 100).toFixed(2).replace('.', ',');
  const rows = [['Fecha', 'Día', 'Tipo', 'Entrada', 'Salida', 'Horas normales', 'Horas feriado', 'Extras 50%', 'Extras 100%', 'Remunerativo', 'Comida', 'Viático especial', 'Neto estimado', 'Nota']];
  const fechas = [...new Set(Object.values(state.turnos).map(t => t.fecha))].sort();
  for (const f of fechas) {
    const ts = turnosDe(f), D = calcDia(ts, aj, tl);
    rows.push([f, DIAS[dow(f)], ts.map(x => etiquetaTipo(x.tipo)).join(' + '), ts.map(x => x.entrada).filter(Boolean).join(' / '), ts.map(x => x.salida).filter(Boolean).join(' / '),
      n2(D.normal / 60), n2(D.normalFer / 60), n2(D.e50 / 60), n2(D.e100 / 60), n2(D.rem), n2(D.comida), n2(D.especial), n2(D.neto), ts.map(x => x.nota).filter(Boolean).join(' / ')]);
  }
  const csv = '﻿' + rows.map(r => r.map(c => { const s = String(c); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\r\n');
  const ok = await ofrecerArchivo('horas-sueldo-' + hoy() + '.csv', csv);
  if (ok) toast('Archivo listo');
}
function importarArchivo(file) {
  const fr = new FileReader();
  fr.onload = async () => {
    let o = null;
    try { o = JSON.parse(String(fr.result)); } catch (e) {}
    const est = o && (o.estado || (o.turnos ? o : null));
    if (!est || typeof est.turnos !== 'object') { toast('Ese archivo no es una copia de esta app.'); return; }
    const inc = normalize(est), n = Object.keys(inc.turnos).length;
    const ok = await dialogo({ titulo: 'Cargar copia', texto: 'La copia tiene ' + n + (n === 1 ? ' día' : ' días') + '. Se suman a los que ya tenés; si un día está en los dos lados, queda la versión más nueva.', ok: 'Cargar' });
    if (!ok) return;
    state = mergeStates(state, inc);
    persist(); toast('Copia cargada');
  };
  fr.readAsText(file);
}

const TABS = ['hoy', 'dias', 'cobro', 'ajustes'];
function irA(tab) {

  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.go === tab)));
  renderCurrent();
  window.scrollTo(0, 0);
}
function renderCurrent() {
  if (ui.tab === 'hoy') renderHoy();
  else if (ui.tab === 'dias') renderDias();
  else if (ui.tab === 'cobro') renderCobro();
  else renderAjustes();
}
function renderSoft() {
  const a = document.activeElement;
  if (a && a.closest && a.closest('main') && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  renderCurrent();
}

document.addEventListener('click', async e => {
  const go = e.target.closest('[data-go]');
  if (go) { irA(go.dataset.go); if (go.id === 'chip-store') setTimeout(() => { const d = $('datos'); if (d) d.scrollIntoView({ block: 'start' }); }, 30); return; }

  // Editor
  const edb = e.target.closest('[data-ed]');
  if (edb && ed) {
    const a = edb.dataset.ed;
    if (a === 'cerrar') cerrarEditor();
    else if (a === 'guardar') guardarEditor(false);
    else if (a === 'guardar-otro') guardarEditor(true);
    else if (a === 'borrar') { if (!ed.conf) { leerEditor(); ed.conf = true; renderEditor(); setTimeout(() => { if (ed && ed.conf) { ed.conf = false; renderEditor(); } }, 4000); } else { const id = ed.id; cerrarEditor(); borrarTurno(id); } }
    return;
  }
  const tb = e.target.closest('[data-edtipo]');
  if (tb && ed) { leerEditor(); ed.d.tipo = tb.dataset.edtipo; ed.err = ''; renderEditor(); return; }
  const sb = e.target.closest('[data-edsal]');
  if (sb && ed) { leerEditor(); ed.d.salida = sb.dataset.edsal; renderEditor(); return; }
  if (e.target.id === 'ed-scrim') { cerrarEditor(); return; }

  // Ajustes: botones segmentados
  const sg = e.target.closest('[data-ajseg]');
  if (sg) {
    const k = sg.dataset.ajseg, v = sg.dataset.v;
    state.ajustes = { ...state.ajustes, [k]: ['bloqueTarde', 'redondeo'].includes(k) ? +v : v };
    state.ajustesMod = Date.now();
    if (k === 'periodo') ui.periodo = null;
    persist();
    return;
  }

  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, aj = AJ();
  if (act === 'entre') {
    state.activo = { fecha: hoy(), entrada: ahoraHM() }; state.activoMod = Date.now(); persist();
    toast('Entrada ' + state.activo.entrada, { label: 'Cambiar', fn: () => document.querySelector('[data-act="editar-entrada"]') && document.querySelector('[data-act="editar-entrada"]').click() });
  } else if (act === 'sali') {
    const a = state.activo; if (!a) return;
    const id = newId(), sal = ahoraHM();
    state.turnos[id] = { id, fecha: a.fecha, tipo: 'trabajo', entrada: a.entrada, salida: sal, pausa: 0, feriado: null, te: '', ts: '', nota: '', mod: Date.now() };
    state.activo = null; state.activoMod = Date.now(); persist();
    const D = calcDia(turnosDe(a.fecha), aj, tarifas());
    toast('Salida ' + sal + ' · ' + hTxt(D.min) + ' · ' + m0(D.neto), { label: 'Editar', fn: () => abrirEditor({ id }) });
  } else if (act === 'editar-entrada') {
    const a = state.activo; if (!a) return;
    const v = await pedirHora('Hora de entrada', a.entrada);
    if (isHM(v) && state.activo) { state.activo = { ...state.activo, entrada: v }; state.activoMod = Date.now(); persist(); }
  } else if (act === 'cancelar-entrada') {
    const prev = state.activo; if (!prev) return;
    state.activo = null; state.activoMod = Date.now(); persist();
    toast('Cancelaste la entrada', { label: 'Deshacer', fn: () => { state.activo = prev; state.activoMod = Date.now(); persist(); } });
  } else if (act === 'cerrar-abierto') {
    const a = state.activo, sal = $('cerrar-salida') ? $('cerrar-salida').value : '';
    if (!a || !isHM(sal)) { toast('Poné a qué hora saliste.'); return; }
    const id = newId();
    state.turnos[id] = { id, fecha: a.fecha, tipo: 'trabajo', entrada: a.entrada, salida: sal, pausa: 0, feriado: null, te: '', ts: '', nota: '', mod: Date.now() };
    state.activo = null; state.activoMod = Date.now(); persist(); toast('Guardado el ' + fCorta(a.fecha));
  } else if (act === 'descartar-abierto') {
    const ok = await dialogo({ titulo: 'Descartar el turno abierto', texto: 'Se borra la entrada del ' + fLarga(state.activo.fecha) + '. Si trabajaste, mejor cargá la salida.', ok: 'Descartar', peligro: true });
    if (ok) { state.activo = null; state.activoMod = Date.now(); persist(); }
  } else if (act === 'nuevo') abrirEditor({ fecha: b.dataset.fecha, tipo: b.dataset.tipo });
  else if (act === 'editar') abrirEditor({ id: b.dataset.id });
  else if (act === 'per') {
    const keys = listaPeriodos(aj), i = keys.indexOf(ui.periodo) + (+b.dataset.d);
    if (i >= 0 && i < keys.length) { ui.periodo = keys[i]; renderCobro(); }
  } else if (act === 'tarifa') editarTarifa(b.dataset.desde || null);
  else if (act === 'copia') guardarCopia();
  else if (act === 'csv') exportarCSV();
  else if (act === 'importar') $('imp-file').click();
  else if (act === 'reset-aj') {
    const ok = await dialogo({ titulo: 'Volver a los ajustes iniciales', texto: 'Se restablecen el horario, los recargos, los descuentos y el cobro. Tus días y los valores del convenio no cambian.', ok: 'Restablecer' });
    if (ok) { const ing = state.ajustes.ingreso; state.ajustes = ing ? { ingreso: ing } : {}; state.ajustesMod = Date.now(); persist(); toast('Ajustes restablecidos'); }
  } else if (act === 'borrar-todo') {
    const n = Object.keys(state.turnos).length;
    const ok = await dialogo({ titulo: 'Borrar todos tus días', texto: 'Se borran ' + n + (n === 1 ? ' día cargado' : ' días cargados') + '. Si querés, guardá una copia antes.', ok: 'Borrar todo', peligro: true });
    if (ok) { const ahora = Date.now(); for (const id of Object.keys(state.turnos)) state.borrados[id] = ahora; state.turnos = {}; state.activo = null; state.activoMod = ahora; state.recibos = {}; persist(); toast('Borraste todos tus días'); }
  }
});

document.addEventListener('input', e => {
  if (ed && e.target.closest && e.target.closest('#layer')) { leerEditor(); const p = $('ed-prev'); if (p) p.innerHTML = previewHTML(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (ed && t.id === 'ed-fecha') { leerEditor(); renderEditor(); return; }
  if (t.dataset && t.dataset.aj) {
    const k = t.dataset.aj;
    let v = t.value;
    if (['horaEntrada', 'horaSalida'].includes(k)) { if (!isHM(v)) return; }
    else if (k === 'ingreso') { if (v && !isISO(v)) return; }
    else { v = parseNum(v); if (!Number.isFinite(v) || v < 0) { toast('Escribí un número.'); renderAjustes(); return; } }
    state.ajustes = { ...state.ajustes, [k]: v }; state.ajustesMod = Date.now();
    persist({ noRender: true });
    if (['horasJornada', 'horaSalida', 'recargoComun', 'recargoEspecial'].includes(k)) setTimeout(renderSoft, 0);
    toast('Guardado');
    return;
  }
  if (t.id === 'rec-neto') {
    const v = t.value.trim() === '' ? null : parseNum(t.value);
    if (v !== null && !Number.isFinite(v)) { toast('Escribí el neto como número, por ejemplo 410.250,50'); return; }
    state.recibos[ui.periodo] = { neto: v, mod: Date.now() };
    persist();
  }
  if (t.id === 'imp-file' && t.files && t.files[0]) { importarArchivo(t.files[0]); t.value = ''; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && ed) cerrarEditor(); });
document.addEventListener('toggle', e => { if (ed && e.target && e.target.id === 'ed-more') ed.more = e.target.open; }, true);

// Reloj: actualiza lo que cambia con la hora sin redibujar todo
let ultimoDia = hoy();
setInterval(() => {
  if (hoy() !== ultimoDia) { ultimoDia = hoy(); renderSoft(); return; }
  if (ui.tab !== 'hoy') return;
  document.querySelectorAll('[data-live="ahora"]').forEach(n => { n.textContent = ahoraHM(); });
  if (state.activo && state.activo.fecha === hoy()) {
    const aj = AJ(), pk = periodoDe(hoy(), aj), [d1, d2] = rango(pk), R = resumen(d1, d2, { conActivo: true });
    const D = calcDia([...turnosDe(hoy()), turnoActivoComo()], aj, tarifas());
    const set = (k, v) => document.querySelectorAll('[data-live="' + k + '"]').forEach(n => { n.textContent = v; });
    set('transcurrido', duracionTxt(state.activo)); set('hoyneto', m0(D.neto)); set('neto', m0(R.neto)); set('horas', hTxt(R.min));
  }
}, 15000);

/* ================= Arranque ================= */
const cache = loadCache();
if (cache) state = normalize(cache.estado);
try { localStorage.setItem(CACHE_KEY + ':prueba', '1'); localStorage.removeItem(CACHE_KEY + ':prueba'); } catch (e) { guardadoOk = false; }
irA(ui.tab);
setChip();

window.__hs = { calcTurno, calcDia, resumen, AJ, tarifas, cobroDe, rango, periodoDe, mergeStates, normalize, get state() { return state; }, mode: 'local' };
})();
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
</script>
</body>
